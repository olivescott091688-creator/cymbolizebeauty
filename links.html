<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links | CymbolizeBeauty</title>
  <meta name="description" content="Book with Cymonne, shop her Amazon storefront, and explore CymbolizeBeauty." />
  <link rel="canonical" href="https://cymbolizebeauty.com/links.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #032B29;
      --teal:   #066F6C;
      --gold:   #C9A96E;
      --gold-2: #e2c898;
      --cream:  #FAF7F2;
      --f-display: 'Fraunces', 'Times New Roman', serif;
      --f-body:    'DM Sans', system-ui, sans-serif;
    }

    html, body {
      min-height: 100%;
      background: var(--ink);
      color: var(--cream);
      font-family: var(--f-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Layout ─── */
    .lt-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 48px;
    }

    /* ─── Logo ─── */
    .lt-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 24px;
    }

    /* ─── Name / Handle ─── */
    .lt-name {
      font-family: var(--f-display);
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 6px;
    }

    .lt-handle {
      font-family: var(--f-body);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 48px;
    }

    /* ─── Divider ─── */
    .lt-rule {
      width: 40px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
      margin: 0 auto 48px;
    }

    /* ─── Link Cards ─── */
    .lt-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 420px;
    }

    .lt-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      border: 1px solid rgba(201, 169, 110, 0.3);
      background: rgba(255, 255, 255, 0.03);
      color: var(--cream);
      text-decoration: none;
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .lt-link:hover,
    .lt-link:focus-visible {
      border-color: var(--gold);
      background: rgba(201, 169, 110, 0.07);
      transform: translateY(-2px);
      outline: none;
    }

    .lt-link:active {
      transform: translateY(0);
    }

    .lt-link-label {
      font-family: var(--f-body);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .lt-link-arrow {
      font-size: 1rem;
      color: var(--gold);
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.2s;
    }

    .lt-link:hover .lt-link-arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    /* ─── Social ─── */
    .lt-social {
      display: flex;
      gap: 24px;
      margin-top: 48px;
    }

    .lt-social a {
      color: rgba(250, 247, 242, 0.5);
      text-decoration: none;
      transition: color 0.2s;
    }

    .lt-social a:hover {
      color: var(--gold);
    }

    /* ─── Footer note ─── */
    .lt-foot {
      margin-top: 48px;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(250, 247, 242, 0.25);
      text-align: center;
    }

    .lt-foot a {
      color: inherit;
      text-decoration: none;
    }

    .lt-foot a:hover {
      color: rgba(250, 247, 242, 0.5);
    }
  </style>
</head>
<body>

<main class="lt-page">

  <!-- Logo -->
  <img src="logo.webp" alt="CymbolizeBeauty" class="lt-logo" />

  <!-- Name -->
  <h1 class="lt-name">Cymbolize Beauty</h1>
  <p class="lt-handle">@cymbolizebeauty</p>

  <div class="lt-rule"></div>

  <!-- Links -->
  <nav class="lt-links" aria-label="Quick links">

    <a href="#" class="lt-link" aria-label="Book directly with Cymonne">
      <span class="lt-link-label">Book Directly</span>
      <span class="lt-link-arrow" aria-hidden="true">→</span>
    </a>

    <a href="#" class="lt-link" target="_blank" rel="noopener" aria-label="Shop Cymonne's Amazon Storefront">
      <span class="lt-link-label">Amazon Storefront</span>
      <span class="lt-link-arrow" aria-hidden="true">→</span>
    </a>

    <a href="index.html" class="lt-link" aria-label="Visit the CymbolizeBeauty website">
      <span class="lt-link-label">Visit Our Website</span>
      <span class="lt-link-arrow" aria-hidden="true">→</span>
    </a>

  </nav>

  <!-- Social -->
  <div class="lt-social">
    <a href="https://instagram.com/cymbolizebeauty" target="_blank" rel="noopener" aria-label="Instagram">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
    </a>
    <a href="https://tiktok.com/@cymbolizebeauty" target="_blank" rel="noopener" aria-label="TikTok">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
    </a>
  </div>

  <!-- Footer note -->
  <p class="lt-foot">
    <a href="index.html">cymbolizebeauty.com</a>
    &nbsp;·&nbsp;
    Las Vegas, NV
  </p>

</main>

</body>
</html>
