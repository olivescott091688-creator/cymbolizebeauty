  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #032B29;
      --ink-2:  #06403D;
      --teal:   #066F6C;
      --gold:   #C9A96E;
      --gold-2: #e2c898;
      --cream:  #FAF7F2;
      --f-display: 'Fraunces', 'Times New Roman', serif;
      --f-body:    'DM Sans', system-ui, sans-serif;
    }

    html {
      background: var(--ink);
    }

    body {
      min-height: 100svh;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(6,111,108,0.28) 0%, transparent 70%),
        var(--ink);
      color: var(--cream);
      font-family: var(--f-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Grain overlay ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Page layout ─── */
    .lt-page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px 56px;
    }

    /* ─── Logo ring ─── */
    .lt-logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 28px;
    }

    .lt-logo-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(201, 169, 110, 0.35);
    }

    .lt-logo-ring::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px solid rgba(201, 169, 110, 0.12);
    }

    .lt-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: contain;
      background: rgba(255,255,255,0.03);
      padding: 12px;
    }

    /* ─── Name / Handle / Tagline ─── */
    .lt-name {
      font-family: var(--f-display);
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .lt-handle {
      font-family: var(--f-body);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 10px;
    }

    .lt-tagline {
      font-family: var(--f-display);
      font-style: italic;
      font-size: 0.88rem;
      color: rgba(250, 247, 242, 0.45);
      text-align: center;
      margin-bottom: 44px;
      max-width: 280px;
    }

    /* ─── Gold rule ─── */
    .lt-rule {
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 44px;
    }

    /* ─── Link Cards ─── */
    .lt-links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }

    .lt-link {
      display: grid;
      grid-template-columns: 52px 1fr 28px;
      align-items: center;
      gap: 0;
      padding: 0;
      border: 1px solid rgba(201, 169, 110, 0.22);
      background: rgba(255, 255, 255, 0.03);
      color: var(--cream);
      text-decoration: none;
      transition: border-color 0.25s, background 0.25s, transform 0.22s;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      position: relative;
    }

    .lt-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,169,110,0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .lt-link:hover,
    .lt-link:focus-visible {
      border-color: rgba(201, 169, 110, 0.65);
      background: rgba(201, 169, 110, 0.05);
      transform: translateY(-2px);
      outline: none;
    }

    .lt-link:hover::before {
      opacity: 1;
    }

    .lt-link:active {
      transform: translateY(0);
    }

    /* Icon column */
    .lt-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 60px;
      border-right: 1px solid rgba(201, 169, 110, 0.15);
      color: var(--gold);
      flex-shrink: 0;
      transition: background 0.25s;
    }

    .lt-link:hover .lt-icon {
      background: rgba(201, 169, 110, 0.07);
    }

    /* Label */
    .lt-link-label {
      padding: 20px 18px;
      font-family: var(--f-body);
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* Arrow */
    .lt-link-arrow {
      padding-right: 18px;
      color: var(--gold);
      opacity: 0.5;
      font-size: 0.9rem;
      transition: opacity 0.2s, transform 0.2s;
      text-align: right;
    }

    .lt-link:hover .lt-link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    /* ─── Las Vegas badge ─── */
    .lt-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 36px;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(250, 247, 242, 0.3);
    }

    .lt-badge-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.4;
    }

    /* ─── Social row ─── */
    .lt-social {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 28px;
    }

    .lt-social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(201, 169, 110, 0.2);
      border-radius: 50%;
      color: rgba(250, 247, 242, 0.45);
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .lt-social a:hover {
      color: var(--gold);
      border-color: rgba(201, 169, 110, 0.55);
      background: rgba(201, 169, 110, 0.07);
    }

    /* ─── Footer note ─── */
    .lt-foot {
      margin-top: 48px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(250, 247, 242, 0.18);
      text-align: center;
    }

    .lt-foot a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .lt-foot a:hover {
      color: rgba(250, 247, 242, 0.4);
    }

    /* ─── Fade-in animation ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lt-logo-wrap { animation: fadeUp 0.6s ease both; }
    .lt-name      { animation: fadeUp 0.6s 0.1s ease both; }
    .lt-handle    { animation: fadeUp 0.6s 0.15s ease both; }
    .lt-tagline   { animation: fadeUp 0.6s 0.2s ease both; }
    .lt-rule      { animation: fadeUp 0.6s 0.25s ease both; }
    .lt-links     { animation: fadeUp 0.6s 0.3s ease both; }
    .lt-badge     { animation: fadeUp 0.5s 0.45s ease both; }
    .lt-social    { animation: fadeUp 0.5s 0.5s ease both; }
    .lt-foot      { animation: fadeUp 0.5s 0.55s ease both; }
  </style>
</head>
